# HUGEtools static mirror for mainland China access.
# Current production checkout: /www/hugetools
# Include this inside the server block that listens on a Tianyi-available high port,
# for example: listen 18089;

location = /hugetools {
    return 301 /hugetools/;
}

location /hugetools/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    root /www;
    index index.html;
    try_files $uri $uri/ /hugetools/index.html;
}

location /hugetools/data/ {
    root /www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
