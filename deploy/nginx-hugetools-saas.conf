# HUGEtools Tianyi production gateway.
# Public target port stays on 18089; Node stays private behind Nginx.

server {
    listen 18089 default_server;
    server_name your-domain.com _;
    root /www/hugetools;
    index index.html;

    location /webhook {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep webhook private. Add GitHub hook CIDRs here if using direct public GitHub Webhooks.
        allow 127.0.0.1;
        allow 166.0.17.12;
        deny all;
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        return 200 '{"ok":true,"service":"hugetools","gateway":"nginx","mode":"static-first"}';
    }

    location ~ ^/(calculate-yield|api/calculate-yield|calculate-site-selection|api/calculate-site-selection)$ {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

