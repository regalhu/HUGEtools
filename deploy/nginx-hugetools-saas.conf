# HUGEtools SaaS production gateway.
# Replace your-domain.com with the real domain after DNS is ready.

server {
    listen 80;
    server_name your-domain.com _;

    location /webhook {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep webhook private. Add GitHub hook CIDRs here if using direct public GitHub Webhooks.
        allow 127.0.0.1;
        allow 166.0.17.12;
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

