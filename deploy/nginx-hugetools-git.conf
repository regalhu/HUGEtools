# HUGEtools Git-based production deployment.
# Project checkout: /www/hugetools
# Public URL: http://113.249.104.188:18089/hugetools/

server {
    listen 18089;
    server_name _;

    location = /hugetools {
        return 301 /hugetools/;
    }

    location /hugetools/ {
        root /www;
        index index.html;
        try_files $uri $uri/ /hugetools/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /hugetools/data/ {
        root /www;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
